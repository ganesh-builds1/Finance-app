<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b12" />
  <meta name="description" content="Lumen — a premium personal finance & expense tracker. Track balances, budgets, and spending with beautiful analytics." />
  <title>Lumen · Money Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body data-theme="dark">
  <!-- Ambient gradient blobs (premium fintech backdrop) -->
  <div class="ambient" aria-hidden="true">
    <span class="blob blob--violet"></span>
    <span class="blob blob--blue"></span>
    <span class="blob blob--pink"></span>
    <span class="blob blob--orange"></span>
  </div>

  <!-- Phone frame -->
  <div class="phone" id="phone">
    <div class="phone__notch" aria-hidden="true"></div>

    <!-- App bar (rendered per screen) -->
    <header class="appbar" id="appbar"></header>

    <!-- Screen content -->
    <main class="view" id="view" role="main" tabindex="-1"></main>

    <!-- Center add button -->
    <button class="fab" id="fab" aria-label="Add transaction">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Bottom navigation -->
    <nav class="tabbar" id="tabbar" aria-label="Primary">
      <button class="tab" data-route="home" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-route="analytics" aria-label="Analytics">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-6M22 20H2"/></svg>
        <span>Analytics</span>
      </button>
      <span class="tab tab--spacer" aria-hidden="true"></span>
      <button class="tab" data-route="transactions" aria-label="Transactions">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>
        <span>Activity</span>
      </button>
      <button class="tab" data-route="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.87 1.2V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 2.6 15a1.7 1.7 0 0 0-1.2-2.87H1a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 2.6 7.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 2.6a1.7 1.7 0 0 0 1.2-1.2V1a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 17 2.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 21.4 9v0a1.7 1.7 0 0 0 1.2 2.87H23a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.13Z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Modal / sheet host -->
  <div class="sheet-host" id="sheetHost" aria-hidden="true"></div>
  <!-- Toast host -->
  <div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="true"></div>

  <script src="./js/store.js" defer></script>
  <script src="./js/ui.js" defer></script>
  <script src="./js/charts.js" defer></script>
  <script src="./js/screens.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
